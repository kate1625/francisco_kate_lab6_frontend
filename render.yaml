services:
  - type: web
    name: francisco-kate-lab6-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://francisco-kate-lab6-api-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
